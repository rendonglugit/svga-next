name: Publish to Maven Central
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to use current project version)'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install build platform
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Audit source boundaries
        run: python3 tools/audit_sources.py

      - name: Run unit tests
        run: ./gradlew :svga-core:test :svga-player:testDebugUnitTest :svga-runtime:testDebugUnitTest :svga-compat:testDebugUnitTest

      - name: Build, sign and publish to staging repository
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew publishAllPublicationsToStagingRepository

      - name: Create deployment bundle
        run: |
          cd build/staging-repo
          zip -r ../../bundle.zip .
          cd ../..
          ls -lh bundle.zip

      - name: Upload bundle to Sonatype Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          AUTH_TOKEN=$(echo -n "${CENTRAL_USERNAME}:${CENTRAL_PASSWORD}" | base64 | tr -d '\n')
          DEPLOYMENT_ID=$(curl --fail --silent --show-error \
            --request POST \
            --url "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC" \
            --header "Authorization: Bearer ${AUTH_TOKEN}" \
            --form "bundle=@bundle.zip")
          echo "Successfully uploaded deployment to Sonatype Central Portal!"
          echo "Deployment ID: ${DEPLOYMENT_ID}"
          echo "Check status at: https://central.sonatype.com/publishing/deployments"
