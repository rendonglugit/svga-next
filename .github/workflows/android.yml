name: Android verification
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install build platform
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Audit source boundaries
        run: python3 tools/audit_sources.py
      - name: Test and assemble
        run: ./gradlew :svga-core:test :svga-player:testDebugUnitTest :svga-runtime:testDebugUnitTest :svga-compat:testDebugUnitTest :sample:testDebugUnitTest :sample:assembleDebug :svga-player:assembleRelease :svga-runtime:assembleRelease :svga-compat:assembleRelease
      - uses: actions/upload-artifact@v6
        with:
          name: svga-next-builds
          path: |
            **/build/outputs/aar/*.aar
            sample/build/outputs/apk/debug/*.apk
            **/build/reports/tests/**
